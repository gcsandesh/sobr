<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden}
body{font-family:Figtree,sans-serif;position:relative;
 background:radial-gradient(700px 520px at 85% 92%,rgba(251,191,36,.28),transparent 70%),
            radial-gradient(900px 700px at 0% 0%,rgba(46,157,149,.22),transparent 60%),
            linear-gradient(180deg,#E4F4EE 0%,#F4F9F7 45%,#FBF8F1 100%)}
.cap{position:absolute;top:120px;left:0;right:0;text-align:center;padding:0 70px}
h1{font:800 92px/1.02 'Bricolage Grotesque',sans-serif;letter-spacing:-2.5px;color:#16211F}
h1 em{display:block;font-style:normal;font-weight:500;color:#1F6F6B}
p{margin-top:28px;font-size:36px;line-height:1.35;color:#4A5D59}
.phone{position:absolute;left:50%;top:600px;width:760px;margin-left:-380px;border-radius:84px;padding:18px;
 background:linear-gradient(145deg,#1d2a28,#0d1514);box-shadow:0 50px 120px rgba(20,80,77,.35),inset 0 0 0 3px rgba(255,255,255,.06)}
.screen{border-radius:68px;overflow:hidden;background:#EAF5F1}.status{height:92px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 64px 14px;font:600 30px Figtree,sans-serif;color:#16211F}.status i{width:44px;height:22px;border-radius:6px;border:3px solid #16211F;opacity:.8}.phone img{display:block;width:100%}
.notch{position:absolute;top:36px;left:50%;width:150px;height:40px;margin-left:-75px;border-radius:22px;background:#0d1514;z-index:2}
</style></head><body>
<div class="cap"><h1>Every streak<em>grows a tree.</em></h1><p>Finished streaks are planted in your forest, coloured by season.</p></div>
<div class="phone"><div class="notch"></div><div class="screen"><div class="status"><span>9:41</span><i></i></div><img src="../raw/raw_forest.png"></div></div>
</body></html>
