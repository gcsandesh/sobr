<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light only" />
  </head>
  <!--
    sobr — Supabase "Reset Password" template (Authentication → Emails →
    Templates → Reset Password). Code only, no link: the app's Forgot password
    screen takes the code, and a link would point at the Site URL (localhost).
    Same house rules as auth-code.html: no <img>, tables, inline styles.
  -->
  <body style="margin:0;padding:0;background:#F0F5F3;">
    <div style="max-width:520px;margin:0 auto;padding:32px 20px;font-family:Georgia,'Times New Roman',serif;color:#16211F;">
      <div style="background:#FAFDFC;border-radius:16px;padding:28px;border:1px solid #D5E3DE;">
        <div style="font-size:22px;font-weight:bold;color:#1F6F6B;margin-bottom:4px;">sobr</div>
        <div style="font-size:13px;color:#6F8480;margin-bottom:20px;">Clear days, counted.</div>
        <div style="font-size:19px;margin-bottom:14px;">Reset your password</div>
        <div style="font-size:15px;line-height:22px;color:#4A5D59;margin-bottom:22px;">
          Enter this code in the app, then choose a new password.
        </div>
        <table role="presentation" align="center" style="border-collapse:collapse;margin:0 auto 22px;">
          <tr>
            <td align="center" style="background:#E2F2EF;border:1px solid #BFDED8;border-radius:12px;padding:18px 26px;">
              <div style="font-family:'SF Mono',Menlo,Consolas,monospace;font-size:30px;font-weight:bold;letter-spacing:4px;color:#1F6F6B;">{{ .Token }}</div>
            </td>
          </tr>
        </table>
        <div style="font-size:13px;color:#6F8480;text-align:center;">It expires in an hour and works once.</div>
      </div>
      <div style="text-align:center;font-size:12px;color:#6F8480;padding:16px;line-height:18px;">
        Didn't ask for this? You can ignore it. Your password stays the same without the code.
      </div>
    </div>
  </body>
</html>
