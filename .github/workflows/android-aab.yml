# Builds a signed Android App Bundle (.aab) for Google Play, on demand.
# Actions → "Android AAB (Play Store)" → Run workflow. The .aab is attached to
# the run as an artifact; download it and upload it in Play Console.
#
# Unlike the sideload APK (debug-signed), this is signed with YOUR upload key.
# One-time setup, see DEPLOY.md §5:
#   ANDROID_UPLOAD_KEYSTORE_BASE64   base64 of upload-keystore.jks
#   ANDROID_UPLOAD_KEYSTORE_PASSWORD
#   ANDROID_UPLOAD_KEY_ALIAS
#   ANDROID_UPLOAD_KEY_PASSWORD
# plus the two EXPO_PUBLIC_SUPABASE_* secrets the APK build already uses.
# Lose the keystore and Play can reset it (Play App Signing), but it takes days:
# keep a copy somewhere safe besides GitHub.

name: Android AAB (Play Store)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          missing=""
          for v in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY KEYSTORE_B64 UPLOAD_STORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (see DEPLOY.md §5)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "UPLOAD_STORE_FILE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
          # Play needs a strictly rising versionCode per upload. Offset so a
          # Play build is always above any sideload APK's run number.
          echo "ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sobr/core test

      - name: Generate native Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Sign release builds with the upload key
        working-directory: apps/mobile/android
        # A second android {} block merges into the generated one and points
        # the release build type at the upload key instead of the debug key.
        run: |
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  upload {
                      storeFile file(System.getenv('UPLOAD_STORE_FILE'))
                      storePassword System.getenv('UPLOAD_STORE_PASSWORD')
                      keyAlias System.getenv('UPLOAD_KEY_ALIAS')
                      keyPassword System.getenv('UPLOAD_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.upload
                  }
              }
          }
          GRADLE

      - name: Build release bundle
        working-directory: apps/mobile/android
        run: |
          ./gradlew bundleRelease \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            --no-daemon

      - name: Verify it is signed with the upload key
        id: aab
        run: |
          AAB=apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          want=$(keytool -list -v -keystore "$UPLOAD_STORE_FILE" -storepass "$UPLOAD_STORE_PASSWORD" -alias "$UPLOAD_KEY_ALIAS" | grep 'SHA256:' | head -1 | awk '{print $2}')
          got=$(keytool -printcert -jarfile "$AAB" | grep 'SHA256:' | head -1 | awk '{print $2}')
          echo "upload key: $want"; echo "bundle:     $got"
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "::error::The bundle is not signed with the upload key."
            exit 1
          fi
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          NAME="sobr-${VERSION}-${ANDROID_VERSION_CODE}.aab"
          cp "$AAB" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.aab.outputs.name }}
          path: ${{ steps.aab.outputs.name }}
          retention-days: 30

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
